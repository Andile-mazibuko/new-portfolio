<div class="cont">
  <h1 class="center">
    Featured Creations
  </h1>
  <div class="projects-cont">
    <mat-card *ngFor="let project of projects">
       <div class="project-image-container">
          <img [style]="project.projectTpe === 'Web-App' ? 'width: 100%; height: 100%; object-fit: cover;' : ''" mat-card-image [src]="project.filePaths[0]" alt="{{project.name}} image">
       </div>
       <div class="project-name">
        <h1> {{ project.name }} </h1>
       </div>
    </mat-card>
  </div>

</div>
