<div class="cont">
  <div class="route-head">
    <h1 class="center">Let’s build something great together</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Unde, consequuntur.</p>
  </div>
  <div class="content">
    <div class="form-container center">
      <app-email [isDisabled]="isDisabledVal"></app-email>
    </div>
    <div class="socials">
        <div class="contact-img">
          <img src="assets/images/contact.png" alt="">
        </div>
        <h2 class="center">Get in touch</h2>
        <div class="contact-info">
          <div class="info">
            <i class="bi bi-envelope-at"></i> <span>{{ about.email }}</span>
          </div>
          <div class="info">
            <i class="bi bi-telephone"></i> <span>{{ about.cellphone }}</span>
          </div>
          <div class="info">
            <i class="bi bi-geo-alt"></i> <span>{{ about.address }}</span>
          </div>
          <div class="links">
            <app-socials></app-socials>
          </div>
        </div>
    </div>
  </div>
</div>
