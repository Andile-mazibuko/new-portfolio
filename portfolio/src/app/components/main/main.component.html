<div class="body">
  <div class="cont">
    <div class="content">
       
      <div class="avail-indicator center">
        <div class="circle center">
          <div class="inside-circle"></div>
        </div>
        <p>Available for Opportunities</p>
       </div>
       
      <h4>HELLO, I'M</h4>
      <h1 class="h1">{{ about.firstName }}</h1>
      <h1 class="h1 lastName"> {{ about.lastName }} <div class="dot"></div></h1>
      <h2>
        {{ about.profession }}
      </h2>
      <p>{{ about.ambition }}</p>
      <div class="socials">
        <app-socials></app-socials>
      </div>
      <div class="btn-cont">
        <button mat-button class="btn download"><mat-icon>download</mat-icon>Download CV</button>
        <button mat-button class="btn contact" (click)="openEmailDialog()">
          Contact Me
        </button>
      </div>
    </div>

    <div class="img-area">
      <div class="skill-cont top-left">
        <img [src]="displaySkills[0]?.path" alt="" loading="lazy"/>
      </div>
      <div class="skill-cont left-middle">
        <img [src]="displaySkills[5]?.path" alt="" loading="lazy"/>
      </div>
      <div class="skill-cont top-right">
        <img [src]="displaySkills[1]?.path" alt="" loading="lazy"/>
      </div>
      <div class="skill-cont top-middle">
        <img [src]="displaySkills[6]?.path" alt="" loading="lazy"/>
      </div>
      <div class="skill-cont bott-left">
        <img [src]="displaySkills[2]?.path" alt="" loading="lazy"/>
      </div>
      <div class="skill-cont bott-middle">
        <img [src]="displaySkills[7]?.path" alt="" loading="lazy"/>
      </div>
      <div class="skill-cont bott-right">
        <img [src]="displaySkills[3]?.path" alt="" loading="lazy" />
      </div>
      <div class="skill-cont right-middle">
        <img [src]="displaySkills[8]?.path" alt="" loading="lazy" />
      </div>
      <div class="main-img">
        <img src="assets/images/copy.png" alt="" loading="lazy" />
      </div>
      
    </div>
    <div
      [style.left]="randLeft"
      [style.top]="randTop"
      class="random-skill center"
    >
      <img [src]="displaySkill?.path" alt="" loading="lazy"/>
    </div>
  </div>
  <app-footer></app-footer>
</div>
