<div class="cont">
  <div class="content">
    <h1 class="h1">Hey, I'm {{ about.firstName +" "+ about.lastName}}</h1>
    <p>{{about.ambition}}</p>
    <div class="btn-cont">
      <button mat-button class="btn">Download CV</button>
      <button mat-button class="btn" (click)="openEmailDialog()">Contact Me</button>
    </div>
    <div class="socials">
        <a href="">
            <i class="bi bi-instagram"></i>
            <div class="link-label">Instagram</div>
        </a>
        <a href="">
            <i class="bi bi-facebook"></i>
            <div class="link-label">facebook</div>
        </a>
        <a href="">
            <i class="bi bi-linkedin"></i>
            <div class="link-label">Linkedin</div>
        </a>
        <a href="">
            <i class="bi bi-github"></i>
            <div class="link-label">Github</div>
        </a>
    </div>
  </div>
  <div class="img-area">
    <img src="assets/images/copy.png" alt="" />
  </div>
</div>
