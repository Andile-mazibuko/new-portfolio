<div class="cont">
  <div class="content">
    <h1 class="h1">Hey, I'm {{ about.firstName +" "+ about.lastName}}</h1>
    <p>{{about.ambition}}</p>
    <div class="btn-cont">
      <button mat-button class="btn">Download CV</button>
      <button mat-button class="btn" (click)="openEmailDialog()">Contact Me</button>
    </div>
    <div class="socials">
      <app-socials></app-socials>
    </div>
  </div>
  <div class="img-area">
    <div class="skill-cont top-left" ><img [src]="displaySkills[0].path" alt=""></div>
    <div class="skill-cont top-right"><img [src]="displaySkills[1].path" alt=""></div>
    <div class="skill-cont bott-left"><img [src]="displaySkills[2].path" alt=""></div>
    <div class="skill-cont bott-right"><img [src]="displaySkills[3].path" alt=""></div>
    <img src="assets/images/copy.png" alt="" />
  </div>
</div>
